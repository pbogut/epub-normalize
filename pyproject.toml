[project]
name = "epub-normalize"
version = "0.1.0"
description = "Normalize EPUB typography from the command line."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md"]
requires-python = ">=3.12"
dependencies = ["defusedxml>=0.7.1", "lxml>=6.0.0"]

[project.scripts]
epub-normalize = "epub_optimizer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "ruff>=0.12.0"]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
